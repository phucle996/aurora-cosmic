name: AURORA CI Workflow

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Sub-Projects
    runs-on: ubuntu-latest
    outputs:
      go-ingester: ${{ steps.filter.outputs.go-ingester }}
      rust-preprocessor: ${{ steps.filter.outputs.rust-preprocessor }}
      python-ml-worker: ${{ steps.filter.outputs.python-ml-worker }}
      gold-builder: ${{ steps.filter.outputs.gold-builder }}
      rust-inference: ${{ steps.filter.outputs.rust-inference }}
      go-api: ${{ steps.filter.outputs.go-api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      shared: ${{ steps.filter.outputs.shared }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go-ingester:
              - 'apps/go-ingester/**'
            rust-preprocessor:
              - 'apps/rust-preprocessor/**'
            python-ml-worker:
              - 'apps/python-ml-worker/**'
            gold-builder:
              - 'apps/python-gold-builder/**'
              - 'apps/python-ml-worker/aurora_ml/pipeline/**'
            rust-inference:
              - 'apps/rust-inference/**'
            go-api:
              - 'apps/go-api/**'
            dashboard:
              - 'apps/dashboard/**'
            shared:
              - 'contracts/**'
              - '.github/workflows/**'
            compose:
              - 'docker-compose.yml'
              - '.env.example'
              - 'infra/**'

      - name: Write release change manifest
        run: |
          cat > changed-subprojects.env <<EOF
          go_ingester=${{ steps.filter.outputs.go-ingester }}
          rust_preprocessor=${{ steps.filter.outputs.rust-preprocessor }}
          python_ml_worker=${{ steps.filter.outputs.python-ml-worker }}
          gold_builder=${{ steps.filter.outputs.gold-builder }}
          rust_inference=${{ steps.filter.outputs.rust-inference }}
          go_api=${{ steps.filter.outputs.go-api }}
          dashboard=${{ steps.filter.outputs.dashboard }}
          shared=${{ steps.filter.outputs.shared }}
          EOF

      - name: Upload release change manifest
        uses: actions/upload-artifact@v4
        with:
          name: changed-subprojects
          path: changed-subprojects.env
          retention-days: 1

  docker-config:
    name: Validate Docker Compose Config
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  go-ingester-checks:
    name: Go Verification (go-ingester)
    needs: changes
    if: ${{ needs.changes.outputs.go-ingester == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: apps/go-ingester/go.sum
      - name: Verify go-ingester
        working-directory: apps/go-ingester
        run: |
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go test -v ./...
          go build ./...

  go-api-checks:
    name: Go Verification (go-api)
    needs: changes
    if: ${{ needs.changes.outputs.go-api == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: apps/go-api/go.sum
      - name: Verify go-api
        working-directory: apps/go-api
        run: |
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go test -v ./...
          go build ./...

  rust-preprocessor-checks:
    name: Rust Verification (rust-preprocessor)
    needs: changes
    if: ${{ needs.changes.outputs.rust-preprocessor == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rust-preprocessor -> target
          cache-on-failure: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcfitsio-dev pkg-config
      - name: Verify rust-preprocessor
        working-directory: apps/rust-preprocessor
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
          cargo build

  rust-inference-checks:
    name: Rust Verification (rust-inference)
    needs: changes
    if: ${{ needs.changes.outputs.rust-inference == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rust-inference -> target
          cache-on-failure: true
      - name: Verify rust-inference
        working-directory: apps/rust-inference
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
          cargo build

  python-ml-worker-checks:
    name: Python Verification (python-ml-worker)
    needs: changes
    if: ${{ needs.changes.outputs.python-ml-worker == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/python-ml-worker/pyproject.toml
      - name: Install dependencies
        working-directory: apps/python-ml-worker
        run: pip install -e ".[dev]"
      - name: Verify python-ml-worker
        working-directory: apps/python-ml-worker
        run: |
          ruff format --check .
          ruff check .
          PYTHONPATH=. pytest

  gold-builder-checks:
    name: Python Verification (gold-builder)
    needs: changes
    if: ${{ needs.changes.outputs.gold-builder == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/python-gold-builder/pyproject.toml
            apps/python-ml-worker/pyproject.toml
      - name: Install dependencies
        working-directory: apps/python-gold-builder
        run: |
          pip install -e "../python-ml-worker[dev]"
          pip install -e ".[dev]"
      - name: Verify gold-builder
        working-directory: apps/python-gold-builder
        run: |
          ruff format --check .
          ruff check .
          PYTHONPATH=../python-ml-worker:. pytest

  dashboard-checks:
    name: Dashboard Verification (React TSX & Vite)
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Build Dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

  scan-go-ingester:
    needs: changes
    if: ${{ needs.changes.outputs.go-ingester == 'true' }}
    name: Trivy Scan (go-ingester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: apps/go-ingester
          format: table
          severity: CRITICAL,HIGH
          version: latest

  scan-rust-preprocessor:
    needs: changes
    if: ${{ needs.changes.outputs.rust-preprocessor == 'true' }}
    name: Trivy Scan (rust-preprocessor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: apps/rust-preprocessor
          format: table
          severity: CRITICAL,HIGH
          version: latest

  scan-python-ml-worker:
    needs: changes
    if: ${{ needs.changes.outputs.python-ml-worker == 'true' }}
    name: Trivy Scan (python-ml-worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: apps/python-ml-worker
          format: table
          severity: CRITICAL,HIGH
          version: latest

  scan-gold-builder:
    needs: changes
    if: ${{ needs.changes.outputs.gold-builder == 'true' }}
    name: Trivy Scan (gold-builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: apps/python-gold-builder
          format: table
          severity: CRITICAL,HIGH
          version: latest

  scan-rust-inference:
    needs: changes
    if: ${{ needs.changes.outputs.rust-inference == 'true' }}
    name: Trivy Scan (rust-inference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: apps/rust-inference
          format: table
          severity: CRITICAL,HIGH
          version: latest

  scan-go-api:
    needs: changes
    if: ${{ needs.changes.outputs.go-api == 'true' }}
    name: Trivy Scan (go-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: apps/go-api
          format: table
          severity: CRITICAL,HIGH
          version: latest

  scan-dashboard:
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    name: Trivy Scan (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: apps/dashboard
          format: table
          severity: CRITICAL,HIGH
          version: latest
