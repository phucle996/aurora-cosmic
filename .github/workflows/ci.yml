name: AURORA CI Workflow

on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  docker-config:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

  go-checks:
    name: Go Verification (go-ingester & go-api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify go-ingester
        run: |
          cd apps/go-ingester
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go test -v ./...
          go build ./...

      - name: Verify go-api
        run: |
          cd apps/go-api
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go test -v ./...
          go build ./...

  rust-checks:
    name: Rust Verification (rust-preprocessor & rust-inference)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify rust-preprocessor
        run: |
          cd apps/rust-preprocessor
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
          cargo build

      - name: Verify rust-inference
        run: |
          cd apps/rust-inference
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
          cargo build

  python-checks:
    name: Python Verification (python-ml-worker & dashboard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff pytest

      - name: Verify python-ml-worker
        run: |
          cd apps/python-ml-worker
          ruff format --check .
          ruff check .
          PYTHONPATH=. pytest

      - name: Verify dashboard
        run: |
          cd apps/dashboard
          ruff format --check .
          ruff check .
          PYTHONPATH=. pytest

  changes:
    name: Detect Changed Sub-Projects
    runs-on: ubuntu-latest
    outputs:
      go-ingester: ${{ steps.filter.outputs.go-ingester }}
      rust-preprocessor: ${{ steps.filter.outputs.rust-preprocessor }}
      python-ml-worker: ${{ steps.filter.outputs.python-ml-worker }}
      rust-inference: ${{ steps.filter.outputs.rust-inference }}
      go-api: ${{ steps.filter.outputs.go-api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go-ingester:
              - 'apps/go-ingester/**'
            rust-preprocessor:
              - 'apps/rust-preprocessor/**'
            python-ml-worker:
              - 'apps/python-ml-worker/**'
            rust-inference:
              - 'apps/rust-inference/**'
            go-api:
              - 'apps/go-api/**'
            dashboard:
              - 'apps/dashboard/**'
            root:
              - 'README.md'
              - 'ARCH.MD'
              - 'STRUCTURE.MD'
              - 'STAGE.MD'
              - 'Makefile'
              - '.github/**'

  scan-go-ingester:
    needs: changes
    if: ${{ needs.changes.outputs.go-ingester == 'true' }}
    name: Trivy Scan (go-ingester)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/go-ingester'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  scan-rust-preprocessor:
    needs: changes
    if: ${{ needs.changes.outputs.rust-preprocessor == 'true' }}
    name: Trivy Scan (rust-preprocessor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/rust-preprocessor'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  scan-python-ml-worker:
    needs: changes
    if: ${{ needs.changes.outputs.python-ml-worker == 'true' }}
    name: Trivy Scan (python-ml-worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/python-ml-worker'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  scan-rust-inference:
    needs: changes
    if: ${{ needs.changes.outputs.rust-inference == 'true' }}
    name: Trivy Scan (rust-inference)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/rust-inference'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  scan-go-api:
    needs: changes
    if: ${{ needs.changes.outputs.go-api == 'true' }}
    name: Trivy Scan (go-api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/go-api'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  scan-dashboard:
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' }}
    name: Trivy Scan (dashboard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/dashboard'
          format: 'table'
          severity: 'CRITICAL,HIGH'
