name: AURORA Sub-Project GHCR Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'go-ingester/v*'
      - 'rust-preprocessor/v*'
      - 'python-ml-worker/v*'
      - 'rust-inference/v*'
      - 'go-api/v*'
      - 'dashboard/v*'
  workflow_dispatch:

jobs:
  release-go-ingester:
    name: Build & Release go-ingester
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/go-ingester
          file: ./apps/go-ingester/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aurora-go-ingester:latest

  release-rust-preprocessor:
