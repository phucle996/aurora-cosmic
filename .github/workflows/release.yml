name: AURORA Sub-Project GHCR Release

on:
  workflow_run:
    workflows: ["AURORA CI Workflow"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  release-go-ingester:
    name: Build & Release go-ingester
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/go-ingester
          file: ./apps/go-ingester/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aurora-go-ingester:latest

  release-rust-preprocessor:
