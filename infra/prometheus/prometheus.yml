global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # cAdvisor is the source of truth for container CPU, memory, network, and
  # lifecycle metrics. Application-level /metrics endpoints can be added as
  # each worker exposes Prometheus instrumentation without changing the UI.
  - job_name: 'aurora-cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
