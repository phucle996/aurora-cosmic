global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aurora-go-ingester'
    metrics_path: /metrics
    static_configs:
      - targets: ['go-ingester:8081']

  - job_name: 'aurora-rust-preprocessor'
    metrics_path: /metrics
    static_configs:
      - targets: ['rust-preprocessor:8082']

  - job_name: 'aurora-python-ml-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['python-ml-worker:8083']

  - job_name: 'aurora-rust-inference'
    metrics_path: /metrics
    static_configs:
      - targets: ['rust-inference:8084']

  - job_name: 'aurora-go-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['go-api:8086']

  # Open-source infrastructure metrics. These targets stay on the internal
  # Docker network; the dashboard reads their time series through the API.
  - job_name: 'aurora-minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'aurora-nats'
    metrics_path: /metrics
    static_configs:
      - targets: ['nats-exporter:7777']

  - job_name: 'aurora-clickhouse'
    metrics_path: /metrics
    static_configs:
      - targets: ['clickhouse:9363']

  - job_name: 'aurora-cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
