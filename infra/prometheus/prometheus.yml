global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aurora-go-ingester'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'aurora-rust-preprocessor'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'aurora-python-ml-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: 'aurora-rust-inference'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8084']

  - job_name: 'aurora-go-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8086']

  # Native services run under the current user's systemd manager. This
  # exporter includes units without an application /metrics endpoint (Gold
  # Builder and dashboard) and exposes their active state, restart count, CPU
  # and memory usage.
  - job_name: 'aurora-systemd'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9580']

  # Open-source infrastructure metrics. These targets stay on the internal
  # Docker network; the dashboard reads their time series through the API.
  - job_name: 'aurora-minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'aurora-nats'
    metrics_path: /metrics
    static_configs:
      - targets: ['nats-exporter:7777']

  - job_name: 'aurora-clickhouse'
    metrics_path: /metrics
    static_configs:
      - targets: ['clickhouse:9363']

  - job_name: 'aurora-cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
