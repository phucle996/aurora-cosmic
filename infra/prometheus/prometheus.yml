global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aurora-go-ingester'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8081']

  - job_name: 'aurora-rust-preprocessor'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8082']

  - job_name: 'aurora-python-ml-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8083']

  - job_name: 'aurora-enrichment'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8088']

  - job_name: 'aurora-rust-inference'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8084']

  - job_name: 'aurora-go-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8086']

  - job_name: 'aurora-minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['127.0.0.1:9000']

  - job_name: 'aurora-clickhouse'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9363']

  - job_name: 'aurora-nats'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:7777']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
