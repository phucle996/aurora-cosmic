global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aurora-go-ingester'
    metrics_path: /metrics
    static_configs:
      - targets: ['go-ingester:8081']

  - job_name: 'aurora-rust-preprocessor'
    metrics_path: /metrics
    static_configs:
      - targets: ['rust-preprocessor:8082']

  # Infrastructure exporters are optional. Service-level observers expose
  # stable application metrics directly through their own /metrics endpoints.
  - job_name: 'aurora-cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
