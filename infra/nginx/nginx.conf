pid /home/phucle/.local/share/aurora/nginx.pid;
error_log /home/phucle/.local/share/aurora/nginx_error.log info;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg svgz;
        font/woff                             woff;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;
    
    access_log /home/phucle/.local/share/aurora/nginx_access.log;
    
    client_body_temp_path /home/phucle/.local/share/aurora/nginx_temp/client_body;
    proxy_temp_path /home/phucle/.local/share/aurora/nginx_temp/proxy;
    fastcgi_temp_path /home/phucle/.local/share/aurora/nginx_temp/fastcgi;
    uwsgi_temp_path /home/phucle/.local/share/aurora/nginx_temp/uwsgi;
    scgi_temp_path /home/phucle/.local/share/aurora/nginx_temp/scgi;
    
    sendfile on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 8501;
        server_name _;
        root /home/phucle/.local/share/aurora/dashboard/dist;
        index index.html;

        # Keep browser traffic same-origin for SSE events
        location /api/v1/events {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8080/healthz;
        }

        # Proxy REST API calls to Go API Gateway
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # SPA routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
