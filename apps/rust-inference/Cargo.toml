[package]
name = "aurora-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
anyhow = "1"
bytes = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
prometheus = "0.13"

# Runtime execution and data access.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "cuda", "download-binaries", "tls-rustls"] }
ndarray = "0.17.2"
async-nats = "0.36"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
arrow-array = "54.0"
arrow-schema = "54.0"
parquet = { version = "54.0", features = ["arrow", "zstd"] }
