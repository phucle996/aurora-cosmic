[package]
name = "aurora-preprocessor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-nats = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-util = "0.7"
futures = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# Storage — MinIO / S3-compatible
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

# Integrity
sha2 = "0.10"
hex = "0.4"

# Temporary file management
tempfile = "3"

# FITS decode — wraps CFITSIO (requires cfitsio system library)
fitsio = "0.21"

# Arrow & Parquet for Silver materialization (v54 handles chrono 0.4.45)
arrow = { version = "54.0", features = ["ffi"] }
parquet = { version = "54.0", features = ["zstd"] }

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1.38", features = ["full", "test-util"] }
