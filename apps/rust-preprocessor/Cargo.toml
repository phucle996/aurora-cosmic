[package]
name = "aurora-preprocessor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-nats = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-util = "0.7"
futures = "0.3"

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1.38", features = ["full", "test-util"] }
