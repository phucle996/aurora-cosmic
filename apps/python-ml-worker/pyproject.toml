[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-ml-worker"
version = "0.1.0"
description = "AURORA ML Worker App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyarrow",
    "pydantic",
    "clickhouse-connect",
    # Pin the CUDA wheel generation so a future PyTorch release cannot silently
    # pull a much larger CUDA toolkit into the production image.
    "torch==2.5.1",
    "onnx==1.16.2",
    "onnxruntime-gpu==1.20.2",
    "nvidia-ml-py==12.575.51",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["aurora_ml", "pkg"]
