[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-ml-worker"
version = "0.1.0"
description = "AURORA ML Worker App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyarrow",
    "pydantic",
    "clickhouse-connect",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["aurora_ml", "pkg"]
