services:
  minio:
    image: minio/minio:latest
    container_name: aurora-minio
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
      # Dev-only scrape endpoint: Prometheus can read metrics without
      # application credentials. Restrict the published MinIO port at the
      # deployment boundary when this compose stack is used outside localhost.
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    command: server /data --console-address ":9001"
    volumes:
      - aurora-minio-data:/data
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: aurora-minio-init
    entrypoint: /bin/sh
    command: -c "/infra/minio/init.sh"
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
    volumes:
      - ./infra/minio/init.sh:/infra/minio/init.sh:ro
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy

  nats:
    image: nats:alpine
    container_name: aurora-nats
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: -c /etc/nats/nats.conf
    volumes:
      - aurora-nats-data:/data/jetstream
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/varz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.0
    container_name: aurora-nats-exporter
    restart: unless-stopped
    cpus: "0.10"
    mem_limit: 128m
    memswap_limit: 128m
    command:
      - -varz
      - -connz
      - -healthz
      - -jsz
      - streams
      - http://nats:8222
    expose:
      - "7777"
    networks:
      - aurora-net
    depends_on:
      nats:
        condition: service_healthy

  go-ingester:
    image: ghcr.io/phucle996/aurora-go-ingester:latest
    build: ./apps/go-ingester
    container_name: aurora-go-ingester
    # Keep real-data ingest experiments reproducible on a 4 vCPU / 4 GiB host.
    # memswap_limit equal to mem_limit prevents Docker from hiding pressure in swap.
    cpus: "1.25"
    mem_limit: 768m
    memswap_limit: 768m
    ports:
      - "${AURORA_INGESTER_METRICS_PORT:-8081}:8081"
    env_file:
      - ./apps/go-ingester/.env.example
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  rust-preprocessor:
    image: ghcr.io/phucle996/aurora-rust-preprocessor:latest
    build: ./apps/rust-preprocessor
    container_name: aurora-rust-preprocessor
    cpus: "1.25"
    mem_limit: 1536m
    memswap_limit: 1536m
    ports:
      - "${AURORA_PREPROCESSOR_METRICS_PORT:-8082}:8082"
    env_file:
      - ./apps/rust-preprocessor/.env.example
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  python-ml-worker:
    image: ghcr.io/phucle996/aurora-python-ml-worker:latest
    build: ./apps/python-ml-worker
    container_name: aurora-python-ml-worker
    gpus: all
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "${AURORA_ML_METRICS_PORT:-8083}:8083"
    environment:
      AURORA_ML_MAX_VRAM_MB: "2000"
      AURORA_METRICS_ADDR: "0.0.0.0:8083"
    env_file:
      - ./apps/python-ml-worker/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  rust-inference:
    image: ghcr.io/phucle996/aurora-rust-inference:latest
    build: ./apps/rust-inference
    container_name: aurora-rust-inference
    gpus: all
    ports:
      - "${AURORA_INFERENCE_METRICS_PORT:-8084}:8084"
    env_file:
      - ./apps/rust-inference/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  go-api:
    image: ghcr.io/phucle996/aurora-go-api:latest
    build: ./apps/go-api
    container_name: aurora-go-api
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "${AURORA_API_PORT:-8080}:8080"
      - "${AURORA_API_METRICS_PORT:-8086}:8086"
    env_file:
      - ./apps/go-api/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    image: ghcr.io/phucle996/aurora-dashboard:latest
    build: ./apps/dashboard
    container_name: aurora-dashboard
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "${AURORA_DASHBOARD_PORT:-8501}:8501"
    env_file:
      - ./apps/dashboard/.env.example
    networks:
      - aurora-net
    depends_on:
      - go-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8501/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: aurora-clickhouse
    restart: unless-stopped
    ports:
      - "${AURORA_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${AURORA_CLICKHOUSE_METRICS_PORT:-9363}:9363"
    environment:
      CLICKHOUSE_DB: "${AURORA_CLICKHOUSE_DATABASE:-aurora}"
      CLICKHOUSE_USER: "${AURORA_CLICKHOUSE_USER:-aurora}"
      CLICKHOUSE_PASSWORD: "${AURORA_CLICKHOUSE_PASSWORD:-aurora-dev-password}"
    volumes:
      - aurora-clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    networks:
      - aurora-net
    healthcheck:
      # Authenticate exactly as application clients do; a local socket query
      # can bypass HTTP credentials and otherwise masks an unusable database.
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aurora-cadvisor
    restart: unless-stopped
    privileged: true
    cpus: "0.25"
    mem_limit: 256m
    memswap_limit: 256m
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "${CADVISOR_PORT:-8085}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - aurora-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aurora-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - aurora-net
    depends_on:
      cadvisor:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.1
    container_name: aurora-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - aurora-net
    depends_on:
      - prometheus

networks:
  aurora-net:
    name: aurora-net
    driver: bridge

volumes:
  aurora-minio-data:
    name: aurora-minio-data
  aurora-nats-data:
    name: aurora-nats-data
  aurora-clickhouse-data:
    name: aurora-clickhouse-data
