services:
  minio:
    image: minio/minio:latest
    container_name: aurora-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    volumes:
      - aurora-minio-data:/data
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: aurora-minio-init
    entrypoint: /bin/sh
    command: -c "/infra/minio/init.sh"
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
    volumes:
      - ./infra/minio/init.sh:/infra/minio/init.sh:ro
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy

  nats:
    image: nats:latest
    container_name: aurora-nats
    restart: unless-stopped
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: -c /etc/nats/nats.conf
    volumes:
      - aurora-nats-data:/data/jetstream
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/varz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  go-ingester:
    build:
      context: ./apps/go-ingester
    container_name: aurora-go-ingester
    environment:
      AURORA_ENV: "${AURORA_ENV:-development}"
      AURORA_LOG_LEVEL: "${AURORA_LOG_LEVEL:-info}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
      AURORA_INGEST_CONCURRENCY: "${AURORA_INGEST_CONCURRENCY:-4}"
      AURORA_BRONZE_MAX_BYTES: "${AURORA_BRONZE_MAX_BYTES:-53687091200}"
      AURORA_BRONZE_HIGH_WATERMARK: "${AURORA_BRONZE_HIGH_WATERMARK:-0.90}"
      AURORA_BRONZE_LOW_WATERMARK: "${AURORA_BRONZE_LOW_WATERMARK:-0.60}"
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  rust-preprocessor:
    build:
      context: ./apps/rust-preprocessor
    container_name: aurora-rust-preprocessor
    environment:
      AURORA_ENV: "${AURORA_ENV:-development}"
      AURORA_LOG_LEVEL: "${AURORA_LOG_LEVEL:-info}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
      AURORA_PREPROCESS_WORKERS: "${AURORA_PREPROCESS_WORKERS:-4}"
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  python-ml-worker:
    build:
      context: ./apps/python-ml-worker
    container_name: aurora-python-ml-worker
    environment:
      AURORA_ENV: "${AURORA_ENV:-development}"
      AURORA_LOG_LEVEL: "${AURORA_LOG_LEVEL:-info}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
      AURORA_ML_DEVICE: "${AURORA_ML_DEVICE:-auto}"
      AURORA_ML_BATCH_SIZE: "${AURORA_ML_BATCH_SIZE:-32}"
      AURORA_ML_MAX_VRAM_MB: "${AURORA_ML_MAX_VRAM_MB:-3500}"
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  rust-inference:
    build:
      context: ./apps/rust-inference
    container_name: aurora-rust-inference
    environment:
      AURORA_ENV: "${AURORA_ENV:-development}"
      AURORA_LOG_LEVEL: "${AURORA_LOG_LEVEL:-info}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
      AURORA_ML_DEVICE: "${AURORA_ML_DEVICE:-auto}"
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  go-api:
    build:
      context: ./apps/go-api
    container_name: aurora-go-api
    ports:
      - "${AURORA_API_PORT:-8080}:8080"
    environment:
      AURORA_ENV: "${AURORA_ENV:-development}"
      AURORA_LOG_LEVEL: "${AURORA_LOG_LEVEL:-info}"
      AURORA_API_HOST: "${AURORA_API_HOST:-0.0.0.0}"
      AURORA_API_PORT: "${AURORA_API_PORT:-8080}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
    container_name: aurora-dashboard
    ports:
      - "${AURORA_DASHBOARD_PORT:-8501}:8501"
    environment:
      AURORA_ENV: "${AURORA_ENV:-development}"
      AURORA_LOG_LEVEL: "${AURORA_LOG_LEVEL:-info}"
      AURORA_DASHBOARD_HOST: "${AURORA_DASHBOARD_HOST:-0.0.0.0}"
      AURORA_DASHBOARD_PORT: "${AURORA_DASHBOARD_PORT:-8501}"
      AURORA_API_URL: "${AURORA_API_URL:-http://go-api:8080}"
    networks:
      - aurora-net
    depends_on:
      - go-api

networks:
  aurora-net:
    name: aurora-net
    driver: bridge

volumes:
  aurora-minio-data:
    name: aurora-minio-data
  aurora-nats-data:
    name: aurora-nats-data
