services:
  minio:
    image: minio/minio:latest
    container_name: aurora-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    volumes:
      - aurora-minio-data:/data
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: aurora-minio-init
    entrypoint: /bin/sh
    command: -c "/infra/minio/init.sh"
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-aurora}"
    volumes:
      - ./infra/minio/init.sh:/infra/minio/init.sh:ro
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy

  nats:
    image: nats:alpine
    container_name: aurora-nats
    restart: unless-stopped
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: -c /etc/nats/nats.conf
    volumes:
      - aurora-nats-data:/data/jetstream
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - aurora-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/varz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  go-ingester:
    image: ghcr.io/phucle996/aurora-go-ingester:latest
    container_name: aurora-go-ingester
    command: ["ingest"]
    env_file:
      - ./apps/go-ingester/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  rust-preprocessor:
    image: ghcr.io/phucle996/aurora-rust-preprocessor:latest
    container_name: aurora-rust-preprocessor
    env_file:
      - ./apps/rust-preprocessor/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  python-ml-worker:
    image: ghcr.io/phucle996/aurora-python-ml-worker:latest
    container_name: aurora-python-ml-worker
    env_file:
      - ./apps/python-ml-worker/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  rust-inference:
    image: ghcr.io/phucle996/aurora-rust-inference:latest
    container_name: aurora-rust-inference
    env_file:
      - ./apps/rust-inference/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  go-api:
    image: ghcr.io/phucle996/aurora-go-api:latest
    container_name: aurora-go-api
    ports:
      - "${AURORA_API_PORT:-8080}:8080"
    env_file:
      - ./apps/go-api/.env.example
    networks:
      - aurora-net
    depends_on:
      minio:
        condition: service_healthy

  dashboard:
    image: ghcr.io/phucle996/aurora-dashboard:latest
    container_name: aurora-dashboard
    ports:
      - "${AURORA_DASHBOARD_PORT:-8501}:8501"
    env_file:
      - ./apps/dashboard/.env.example
    networks:
      - aurora-net
    depends_on:
      - go-api

networks:
  aurora-net:
    name: aurora-net
    driver: bridge

volumes:
  aurora-minio-data:
    name: aurora-minio-data
  aurora-nats-data:
    name: aurora-nats-data
